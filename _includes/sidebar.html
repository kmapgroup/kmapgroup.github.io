<div class="jumbotron">
  <h4>News</h4>

  {% comment %} Latest events, newest first, from _data/events.yml (single source of truth). {% endcomment %}
  {% assign recent_events = site.data.events | sort: "sort" | reverse %}
  {% for e in recent_events limit:5 %}
  <b>{{ e.date }}</b>
    <p><a href="{{ "/events/#" | append: e.category | append: "s" | relative_url }}">{{ e.title }}</a></p>
  {% endfor %}

  <h5><a href="{{ "/events/" | relative_url }}">... see all Events</a></h5>

</div>
