- category: conference
  sort: 2025-08-28
  year: 2025
  type: Joint Workshop
  date: "August 28&ndash;29, 2025"
  venue: "#222, Building 1, College of Social Sciences, Kangwon National University"
  title: "KNU&ndash;KU Joint Workshop: Migration and Refugee Politics in the Era of Global Mixed Migration"
  summary: >-
    A two-day joint workshop of the Global Refugee Crisis Research Group (Kangwon Institute for
    Unification Studies, Kangwon National University) and KMAP (Peace and Democracy Institute,
    Korea University), supported by the National Research Foundation of Korea. Day 1 featured an
    invited lecture and two graduate-student sessions; Day 2 was devoted to progress reports from
    each research team and discussion of joint research directions.
  poster: poster_conference/2025-knu-ku-workshop-poster.jpg
  panels:
    - title: "Invited Lecture"
      slot: "13:30&ndash;14:30"
      papers:
        - authors: "Younghoon Song (Kangwon Institute for Unification Studies, Kangwon National University)"
          title: "New Patterns of the Refugee Crisis and the International Community&rsquo;s Response"
      note: >-
        The talk examines why the global refugee crisis is expanding and becoming protracted, why
        conflicts emerge around refugees, and what policy and institutional responses the
        international community can pursue, drawing on key debates in forced-migration research.
    - title: "Graduate Student Session I"
      slot: "14:30&ndash;16:10"
      chair: "Byoungha Lee (University of Seoul)"
      papers:
        - authors: "Heedo Lee (Yonsei University)"
