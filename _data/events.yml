        - authors: "Kyungrim Chung (Yonsei University)"
          title: "Racialized Threats: How Immigration Threat Perception Shapes American Sentiments Toward Foreign Countries"
      discussants: "Hannah Kim (Korea University), Hyunjun Kim (Kangwon National University)"
    - title: "Graduate Student Session II"
      slot: "16:20&ndash;18:00"
      chair: "Yujin Lim (Kangwon National University)"
      papers:
        - authors: "Seungji Lee (Kangwon National University)"
          title: "Thriving in Confinement: What Enables Rohingya Refugee Women&rsquo;s Economic Empowerment in Cox&rsquo;s Bazar"
        - authors: "Yujin An (Korea University)"
          title: "Welfare Attitudes and the Acceptance of Foreigners and North Korean Defectors: Between Welfare Chauvinism and Co-ethnic Solidarity"
        - authors: "Jiwoon Kim (Yonsei University)"
          title: "Security Sensitivity and Destination Choice among Migrant Families: Risk Perception by Child Gender"
        - authors: "Seoyeon Kim (Yonsei University)"
          title: "Trends in the Fragmentation of Korea&rsquo;s Central-Government Policies on Foreign Nationals"
